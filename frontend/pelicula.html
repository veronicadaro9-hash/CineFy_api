
<!DOCTYPE html>
<html lang="es">

<style>
    .rating_circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-color: #ffc107;
        color: #000;
        font-size: 35px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .stars-outer {
        display: inline-block;
        position: relative;
        font-size: 25px;
        letter-spacing: 4px;
    }

    .stars-outer::before {
        content: "☆☆☆☆☆";
        color: #ffc107;
    }

    .stars-inner {
        position: absolute;
        top: 0;
        left: 0;
        white-space: nowrap;
        overflow: hidden;
        width: 82%;
    }

    .stars-inner::before {
        content: "★★★★★";
        color: #ffc107;
    }

    .progress {
        height: 10px;
        background-color: #454545;
    }
</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de película | CineReview</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-black text-white">

    <!-- CABECERA -->
    <header class="bg-dark py-3">
        <div class="container">
            <a href="index.html"
               class="text-decoration-none fs-3 fw-bold">
                <span class="text-warning">Cine</span><span class="text-white">Review</span>
            </a>
        </div>
    </header>

    <main class="container my-5">

        <!-- VOLVER AL BUSCADOR -->
        <a href="index.html" class="btn btn-outline-warning mb-4">
            <i class="bi bi-arrow-left"></i>
            Volver a películas
        </a>

        <!-- DETALLES DE LA PELÍCULA -->
        <section id="detalle">
            <!-- Aquí JavaScript mostrará la película -->
        </section>

        <!-- RESEÑAS -->
        <section class="mt-5">

            <h2 class="mb-4">
                <i class="bi bi-star-fill text-warning me-2"></i>
                Reseñas de usuarios
            </h2>

            <div class="card bg-dark text-white border-secondary p-4 mb-4">

                
<!-- TARJETA DE VALORACIONES BASADA EN CODEPEN -->
<div id="puntuacion" class="mb-4">
    <div class="row align-items-center g-4">

        <div class="col-md-4 text-center">
            <h3 class="mb-3">Reviews</h3>

            <div class="rating_circle mx-auto">
                4.1
            </div>

            <div class="mt-3">
                <div class="stars-outer">
                    <div class="stars-inner"></div>
                </div>
            </div>
        </div>

        <div class="col-md-8">

            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="progress flex-grow-1">
                    <div class="progress-bar bg-warning" style="width:70%"></div>
                </div>
                <span>5</span>
            </div>

            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="progress flex-grow-1">
                    <div class="progress-bar bg-warning" style="width:10%"></div>
                </div>
                <span>4</span>
            </div>

            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="progress flex-grow-1">
                    <div class="progress-bar bg-warning" style="width:10%"></div>
                </div>
                <span>3</span>
            </div>

            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="progress flex-grow-1">
                    <div class="progress-bar bg-warning" style="width:5%"></div>
                </div>
                <span>2</span>
            </div>

            <div class="d-flex align-items-center gap-3">
                <div class="progress flex-grow-1">
                    <div class="progress-bar bg-warning" style="width:5%"></div>
                </div>
                <span>1</span>
            </div>

        </div>
    </div>
</div>


                <hr class="border-secondary">

                <!-- COMENTARIOS -->
                <h3 class="fs-5 mb-3">Opiniones de los espectadores</h3>

                <div id="comentarios">
                    <!-- Aquí aparecerán los comentarios -->
                </div>

            </div>

            <!-- FORMULARIO DE RESEÑAS -->
            <div class="card bg-dark text-white border-secondary p-4">

                <h3 class="mb-4">Escribe tu reseña</h3>

                <form id="formulario-comentario">

                    <label for="persona" class="form-label">
                        Nombre
                    </label>
                    <input type="text"
                           id="persona"
                           class="form-control bg-dark text-white border-secondary mb-3"
                           required>

                    <label for="comentario" class="form-label">
                        Tu opinión
                    </label>
                    <textarea id="comentario"
                              class="form-control bg-dark text-white border-secondary mb-3"
                              rows="4"
                              required></textarea>

<!-- CALIFICACIÓN DE LA PELÍCULA -->
<div class="mb-4">
    <label class="form-label d-block">
        Calificación
    </label>

    <div class="d-flex gap-2 flex-wrap">
        <input type="radio" class="btn-check"
               name="puntuacion" id="p1" value="1" required>
        <label class="btn btn-outline-warning" for="p1">
            ★
        </label>

        <input type="radio" class="btn-check"
               name="puntuacion" id="p2" value="2">
        <label class="btn btn-outline-warning" for="p2">
            ★★
        </label>

        <input type="radio" class="btn-check"
               name="puntuacion" id="p3" value="3">
        <label class="btn btn-outline-warning" for="p3">
            ★★★
        </label>

        <input type="radio" class="btn-check"
               name="puntuacion" id="p4" value="4">
        <label class="btn btn-outline-warning" for="p4">
            ★★★★
        </label>

        <input type="radio" class="btn-check"
               name="puntuacion" id="p5" value="5">
        <label class="btn btn-outline-warning" for="p5">
            ★★★★★
        </label>
    </div>
</div>

                    <label for="fecha" class="form-label">
                        Fecha
                    </label>
                    <input type="date"
                           id="fecha"
                           class="form-control bg-dark text-white border-secondary mb-3"
                           required>

                    <button type="submit" class="btn btn-warning fw-bold">
                        <i class="bi bi-send me-2"></i>
                        Publicar reseña
                    </button>

                </form>
            </div>

        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-dark text-center py-4 mt-5">
        <p class="fw-bold mb-1">
            <i class="bi bi-film text-warning me-2"></i>
            <span class="text-warning">Cine</span>Review
        </p>
        <p class="text-secondary small mb-0">
            Descubre, valora y comparte tus películas favoritas.
        </p>
    </footer>

    <script src="js/pelicula.js"></script>

</body>
</html>
