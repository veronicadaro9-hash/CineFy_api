<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Películas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <header class="container">
        <h1>Buscador de Películas</h1>
    </header>
   
<section class="container mt-4">
    <a href="index.html" class="btn btn-secondary">
        Volver
    </a>

    <div id="detalle" class="mt-4">
        <!-- Aquí aparecerán los detalles -->
    </div>
    <div id="puntuacion"></div>

    <h2 class="mt-4">Comentarios</h2>

    <div id="comentarios">
    <!-- Aquí aparecerán los comentarios -->
    </div>
    <h2 class="mt-4">Añadir comentario</h2>

<form id="formulario-comentario" class="card p-3 mb-4">
    <label for="persona">Nombre</label>
    <input type="text" id="persona" class="form-control">

    <label for="comentario" class="mt-2">Comentario</label>
    <textarea id="comentario" class="form-control" ></textarea>

    <label for="fecha" class="mt-2">Fecha</label>
    <input type="date" id="fecha" class="form-control" required>

    <button type="submit" class="btn btn-success mt-3">
        Guardar comentario
    </button>
</form>

</section>

<script src="js/pelicula.js"></script>
